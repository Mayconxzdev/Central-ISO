name: Bootstrap sanitized release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - '.bootstrap/central-iso.tar.xz.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Extract sanitized release
        shell: bash
        run: |
          base64 --decode .bootstrap/central-iso.tar.xz.b64 > /tmp/central-iso.tar.xz
          tar -xJf /tmp/central-iso.tar.xz -C .
          rm -rf .bootstrap

      - name: Validate release before publishing
        shell: bash
        env:
          APP_ENV: demo
          APP_DATA_MODE: demo
          ISO_SOURCE_PATH: ./demo_iso
          AI_MODE: disabled
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m compileall -q app scripts
          python -m pytest -q
          python scripts/public_safety_scan.py

      - name: Publish sanitized source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
            exit 0
          fi
          git commit -m 'feat: publish sanitized Central ISO portfolio release'
          git push origin HEAD:main
