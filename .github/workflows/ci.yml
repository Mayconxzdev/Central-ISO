name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python
        run: python -m compileall -q app scripts

      - name: Tests
        run: python -m pytest -q

      - name: Public safety scan
        run: python scripts/public_safety_scan.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: API smoke test
        shell: bash
        env:
          APP_ENV: demo
          APP_DATA_MODE: demo
          ISO_SOURCE_PATH: ./demo_iso
          AI_MODE: disabled
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8877 > /tmp/central-iso-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8877/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/central-iso-api.log
          exit 1
