[package]
name = "central-iso"
version = "0.1.0"
description = "Cliente desktop da Central ISO"
authors = ["Maycon Ferreira"]
edition = "2021"

[lib]
name = "central_iso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
